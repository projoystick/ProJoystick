<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Recovery — PROJOYSTICK</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-container">

            <a
                href="../index.html"
                class="auth-logo"
            >
                <span>◆</span>
                PRO<span>JOYSTICK</span>
            </a>

            <div class="auth-card">

                <div class="auth-header">

                    <span class="auth-label">
                        PROJOYSTICK ACCOUNT
                    </span>

                    <h1>
                        Verify your email
                    </h1>

                    <p>
                        Enter your account email address and
                        we'll send you a verification link.
                    </p>

                </div>

                <div
                    id="recoveryMessage"
                    class="auth-message"
                ></div>

                <form id="recoveryForm">

                    <div class="form-group">

                        <label for="recoveryEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="recoveryEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <button
                        type="submit"
                        class="auth-submit"
                        id="recoveryButton"
                    >
                        Send Verification Email
                    </button>

                </form>

                <div
                    id="recoverySent"
                    style="display: none;"
                >

                    <div class="auth-message success">

                        Verification email sent.

                        <br><br>

                        Check your inbox and click the
                        link in the email.

                    </div>

                    <button
                        type="button"
                        class="auth-submit"
                        id="checkVerificationButton"
                    >
                        I Verified My Email
                    </button>

                </div>

            </div>

            <a
                href="login.html"
                class="back-home"
            >
                ← Back to Login
            </a>

        </section>

    </main>

    <script
        type="module"
        src="../js/password-recovery.js"
    ></script>

</body>

</html>
