<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wishlist — PROJOYSTICK</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/wishlist.css">

</head>


<body>


    <!-- ==========================================
         NAVBAR
    =========================================== -->

    <header class="navbar">

        <div class="nav-container">

            <nav class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="games.html">
                    Games
                </a>

                <a href="shop.html">
                    Shop
                </a>

            </nav>


            <div class="nav-actions">

                <button
                    class="search-btn"
                    type="button"
                    aria-label="Search"
                >
                    🔍
                </button>


                <button
                    class="cart-btn"
                    type="button"
                    aria-label="Cart"
                >

                    🛒

                    <span class="cart-count">
                        0
                    </span>

                </button>

            </div>

        </div>

    </header>



    <!-- ==========================================
         WISHLIST PAGE
    =========================================== -->

    <main class="wishlist-page">

        <div class="wishlist-container">


            <!-- ======================================
                 HEADER
            ======================================= -->

            <section class="wishlist-header">

                <div>

                    <span class="page-label">
                        PROJOYSTICK
                    </span>

                    <h1>
                        My Wishlist
                    </h1>

                    <p>
                        Save products you want
                        to come back to later.
                    </p>

                </div>


                <span
                    class="wishlist-count"
                    id="wishlistCount"
                >
                    0 Items
                </span>

            </section>



            <!-- ======================================
                 LOADING
            ======================================= -->

            <div
                class="wishlist-loading"
                id="wishlistLoading"
            >
                Loading wishlist...
            </div>



            <!-- ======================================
                 WISHLIST GRID
            ======================================= -->

            <section
                class="wishlist-grid"
                id="wishlistGrid"
            >
            </section>



            <!-- ======================================
                 EMPTY STATE
            ======================================= -->

            <section
                class="wishlist-empty"
                id="wishlistEmpty"
            >

                <div class="wishlist-empty-icon">
                    ♡
                </div>

                <h2>
                    Your wishlist is empty
                </h2>

                <p>
                    Save products you like and
                    they will appear here.
                </p>

                <a
                    href="shop.html"
                    class="wishlist-shop-btn"
                >
                    Browse Shop
                </a>

            </section>



            <!-- ======================================
                 ERROR
            ======================================= -->

            <section
                class="wishlist-error"
                id="wishlistError"
            >

                <h2>
                    Unable to load wishlist
                </h2>

                <p>
                    Something went wrong while
                    loading your wishlist.
                </p>

                <button
                    type="button"
                    id="wishlistRetryBtn"
                    class="wishlist-retry-btn"
                >
                    Try Again
                </button>

            </section>

        </div>

    </main>



    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script
        type="module"
        src="../js/script.js"
    ></script>

    <script
        type="module"
        src="../js/wishlist.js"
    ></script>

</body>

</html>
