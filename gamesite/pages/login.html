<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login — PROJOYSTICK</title>

    <link rel="stylesheet" href="../css/auth.css">

</head>


<body>

    <main class="auth-page">

        <section class="auth-container">

            <!-- BRAND -->

            <a href="../index.html" class="auth-logo">
                <span>◆</span>
                PRO<span>JOYSTICK</span>
            </a>


            <!-- CARD -->

            <div class="auth-card">

                <div class="auth-header">

                    <span class="auth-label">
                        WELCOME BACK
                    </span>

                    <h1>
                        Login to your account
                    </h1>

                    <p>
                        Continue your gaming journey.
                    </p>

                </div>


                <!-- ERROR / SUCCESS -->

                <div
                    id="authMessage"
                    class="auth-message"
                ></div>


                <!-- FORM -->

                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <div class="password-label">

                            <label for="password">
                                Password
                            </label>

                            <a href="#" id="forgotPassword">
                                Forgot password?
                            </a>

                        </div>

                        <div class="password-input">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                data-target="password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                        id="loginButton"
                    >
                        Login
                    </button>

                </form>


                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <!-- GOOGLE LOGIN -->

                <button
                    type="button"
                    class="google-btn"
                    id="googleLogin"
                >
                    <span class="google-icon">G</span>
                    Continue with Google
                </button>


                <!-- REGISTER -->

                <p class="auth-switch">

                    Don't have an account?

                    <a href="register.html">
                        Create one
                    </a>

                </p>

            </div>


            <a href="../index.html" class="back-home">
                ← Back to PROJOYSTICK
            </a>

        </section>

    </main>


    <script type="module" src="../js/auth.js"></script>

</body>

</html>
