<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Profile — PROJOYSTICK</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="stylesheet" href="../css/profile.css">

</head>


<body>


    <!-- ==========================================
         NAVBAR
    =========================================== -->

    <header class="navbar">

        <div class="nav-container">

            <a href="../index.html" class="logo">
                <span>◆</span>
                GAME<span>VAULT</span>
            </a>


            <nav class="nav-links">

                <a href="../index.html">
                    Home
                </a>

                <a href="#">
                    Games
                </a>

                <a href="#">
                    Products
                </a>

                <a href="#">
                    Deals
                </a>

            </nav>


            <div class="nav-actions">

                <button class="search-btn">
                    🔍
                </button>

                <button class="cart-btn">

                    🛒

                    <span class="cart-count">
                        0
                    </span>

                </button>

                <!-- Auth navbar is generated by script.js -->

            </div>

        </div>

    </header>



    <!-- ==========================================
         PROFILE
    =========================================== -->

    <main class="profile-page">

        <div class="profile-container">


            <!-- PAGE HEADER -->

            <div class="profile-heading">

                <span class="profile-label">
                    ACCOUNT
                </span>

                <h1>
                    My Profile
                </h1>

                <p>
                    Manage your PROJOYSTICK account.
                </p>

            </div>



            <!-- PROFILE LAYOUT -->

            <div class="profile-layout">


                <!-- ==================================
                     PROFILE CARD
                =================================== -->

                <section class="profile-card">


                    <div class="profile-user">


                        <div
                            class="profile-avatar"
                            id="profileAvatar"
                        >
                            ?
                        </div>


                        <div class="profile-user-info">

                            <h2 id="profileUsername">
                                Loading...
                            </h2>

                            <p id="profileEmail">
                                Loading...
                            </p>

                            <span
                                class="member-badge"
                                id="profileRole"
                            >
                                USER
                            </span>

                        </div>

                    </div>


                    <div class="profile-divider"></div>


                    <!-- ACCOUNT INFO -->

                    <div class="info-section">

                        <div class="section-title">

                            <h3>
                                Account Information
                            </h3>

                            <button
                                id="editProfileBtn"
                                class="edit-btn"
                            >
                                Edit Profile
                            </button>

                        </div>


                        <div class="info-grid">


                            <div class="info-item">

                                <span>
                                    Username
                                </span>

                                <strong id="infoUsername">
                                    —
                                </strong>

                            </div>


                            <div class="info-item">

                                <span>
                                    Email
                                </span>

                                <strong id="infoEmail">
                                    —
                                </strong>

                            </div>


                            <div class="info-item">

                                <span>
                                    Member Since
                                </span>

                                <strong id="infoJoined">
                                    —
                                </strong>

                            </div>


                            <div class="info-item">

                                <span>
                                    Account Type
                                </span>

                                <strong id="infoRole">
                                    User
                                </strong>

                            </div>


                        </div>

                    </div>


                </section>



                <!-- ==================================
                     SIDEBAR
                =================================== -->

                <aside class="profile-sidebar">


                    <a
                        href="profile.html"
                        class="sidebar-item active"
                    >

                        <span>👤</span>

                        Profile

                    </a>


                    <a
                        href="orders.html"
                        class="sidebar-item"
                    >

                        <span>📦</span>

                        My Orders

                    </a>


                    <a
                        href="wishlist.html"
                        class="sidebar-item"
                    >

                        <span>♡</span>

                        Wishlist

                    </a>


                    <a
                        href="../index.html"
                        class="sidebar-item"
                    >

                        <span>🛒</span>

                        Continue Shopping

                    </a>


                    <div class="sidebar-divider"></div>


                    <button
                        id="profileLogout"
                        class="sidebar-item logout"
                    >

                        <span>↪</span>

                        Logout

                    </button>


                </aside>


            </div>


        </div>

    </main>



    <!-- ==========================================
         EDIT PROFILE MODAL
    =========================================== -->

    <div
        class="modal-overlay"
        id="profileModal"
    >

        <div class="profile-modal">


            <div class="modal-header">

                <div>

                    <span class="profile-label">
                        ACCOUNT
                    </span>

                    <h2>
                        Edit Profile
                    </h2>

                </div>


                <button
                    class="modal-close"
                    id="closeProfileModal"
                >
                    ×
                </button>

            </div>


            <div
                id="profileMessage"
                class="profile-message"
            ></div>


            <form id="profileForm">


                <div class="modal-form-group">

                    <label for="editUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="editUsername"
                        minlength="3"
                        maxlength="20"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="save-profile-btn"
                    id="saveProfileBtn"
                >
                    Save Changes
                </button>


            </form>


        </div>

    </div>



    <script
        type="module"
        src="../js/script.js"
    ></script>


    <script
        type="module"
        src="../js/profile.js"
    ></script>


</body>

</html>
