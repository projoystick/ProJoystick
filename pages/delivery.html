<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delivery Information — PROJOYSTICK</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link
        rel="stylesheet"
        href="../css/delivery.css"
    >

</head>


<body>

<header class="navbar">

    <div class="nav-container">

        <a
            href="../index.html"
            class="logo"
        >
            PRO<span>JOYSTICK</span>
        </a>

        <div class="nav-actions">

            <a
                href="cart.html"
                class="cart-btn"
            >
                Cart
                <span class="cart-count">
                    0
                </span>
            </a>

        </div>

    </div>

</header>


<main class="delivery-page">

    <div class="delivery-container">

        <div class="delivery-header">

            <span>
                PROJOYSTICK
            </span>

            <h1>
                Delivery Information
            </h1>

            <p>
                Enter the account information required
                to deliver your products.
            </p>

        </div>


        <form id="deliveryForm">


            <div
                id="deliveryGames"
                class="delivery-games"
            ></div>


            <div class="delivery-warning">

                <strong>
                    Important
                </strong>

                <p>
                    Make sure all account information is
                    correct before continuing. Incorrect
                    information may prevent delivery.
                </p>

            </div>


            <button
                type="submit"
                class="delivery-submit"
                id="deliverySubmit"
            >
                Continue to Payment →
            </button>


        </form>

    </div>

</main>


<script
    type="module"
    src="../js/delivery.js"
></script>

</body>

</html>
