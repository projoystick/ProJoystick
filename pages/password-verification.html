<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Recovery — PROJOYSTICK</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-container">

            <!-- BRAND -->

            <a
                href="../index.html"
                class="auth-logo"
            >
                <span>◆</span>
                PRO<span>JOYSTICK</span>
            </a>


            <!-- CARD -->

            <div class="auth-card">

                <!-- HEADER -->

                <div class="auth-header">

                    <span class="auth-label">
                        PROJOYSTICK ACCOUNT
                    </span>

                    <h1 id="verificationTitle">
                        Verify your email
                    </h1>

                    <p id="verificationDescription">
                        Enter your email address to receive
                        a verification link.
                    </p>

                </div>


                <!-- MESSAGE -->

                <div
                    id="verificationMessage"
                    class="auth-message"
                ></div>


                <!-- EMAIL FORM -->

                <form id="verificationForm">

                    <div class="form-group">

                        <label for="verificationEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="verificationEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                        id="verificationButton"
                    >
                        Send Verification Email
                    </button>

                </form>


                <!-- WAITING STATE -->

                <div
                    id="verificationWaiting"
                    style="display: none;"
                >

                    <div
                        class="auth-message success"
                    >

                        Verification email sent.

                        <br><br>

                        Please check your inbox and
                        click the verification link.

                    </div>


                    <button
                        type="button"
                        class="auth-submit"
                        id="checkVerificationButton"
                    >
                        I Verified My Email
                    </button>


                    <button
                        type="button"
                        id="resendVerificationButton"
                        style="
                            width: 100%;
                            margin-top: 10px;
                            padding: 12px;
                            background: transparent;
                            border: 1px solid currentColor;
                            border-radius: 6px;
                            cursor: pointer;
                        "
                    >
                        Resend Email
                    </button>

                </div>


                <!-- VERIFIED STATE -->

                <div
                    id="verificationSuccess"
                    style="display: none;"
                >

                    <div
                        class="auth-message success"
                    >
                        Email verified successfully.
                    </div>

                </div>


                <!-- INVALID LINK -->

                <div
                    id="verificationInvalid"
                    style="display: none;"
                >

                    <div
                        class="auth-message error"
                    >
                        This verification link is invalid
                        or has expired.
                    </div>

                    <button
                        type="button"
                        class="auth-submit"
                        id="tryAgainButton"
                    >
                        Try Again
                    </button>

                </div>

            </div>


            <!-- BACK TO LOGIN -->

            <a
                href="login.html"
                class="back-home"
            >
                ← Back to Login
            </a>

        </section>

    </main>


    <script
        type="module"
        src="../js/password-verification.js"
    ></script>

</body>

</html>
