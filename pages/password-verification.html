<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Password Recovery — PROJOYSTICK</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >
    <link
        rel="stylesheet"
        href="../css/effects.css"
    >
    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link rel="icon" href="../images/webicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-container">

            <!-- BRAND -->

            <a href="../index.html" class="auth-logo">
                <img 
                src="../images/webicon.png" 
                alt="Pro Joystick"class="logo-icon"
                >
                <span
                            class="logo-pro shiny-text"
                            data-shiny-text="PRO"
                            data-speed="2"
                            data-color="#00ff40"
                            data-shine-color="#ffffff"
                            data-spread="120"
                        >
                            PRO
                        </span>

                        <span
                            class="logo-joystick shiny-text"
                            data-shiny-text="JOYSTICK"
                            data-speed="2"
                            data-color="#ffffff"
                            data-shine-color="#00ff40"
                            data-spread="120"
                        >
                            JOYSTICK
                        </span>
            </a>


            <!-- CARD -->

            <div class="auth-card">

                <!-- HEADER -->

                <div class="auth-header">

                    <span class="auth-label">
                        PROJOYSTICK ACCOUNT
                    </span>

                    <h1 id="verificationTitle">
                        Verify your email
                    </h1>

                    <p id="verificationDescription">
                        Enter your email address to receive
                        a verification link.
                    </p>

                </div>


                <!-- MESSAGE -->

                <div
                    id="verificationMessage"
                    class="auth-message"
                ></div>


                <!-- EMAIL FORM -->

                <form id="verificationForm">

                    <div class="form-group">

                        <label for="verificationEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="verificationEmail"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                        id="verificationButton"
                    >
                        Send Verification Email
                    </button>

                </form>


                <!-- WAITING STATE -->

                <div
                    id="verificationWaiting"
                    style="display: none;"
                >

                    <div
                        class="auth-message success"
                    >

                        Verification email sent.
                        Please check your inbox and
                        or spam folder.

                    </div>


                    <button
                        type="button"
                        class="auth-submit"
                        id="checkVerificationButton"
                    >
                        I Verified My Email
                    </button>


                    <button
                        type="button"
                        id="resendVerificationButton"
                        class="resend-verification-button"
                    >
                        Resend Email
                    </button>

                </div>


                <!-- VERIFIED STATE -->

                <div
                    id="verificationSuccess"
                    style="display: none;"
                >

                    <div
                        class="auth-message success"
                    >
                        Email verified successfully.
                    </div>

                </div>


                <!-- INVALID LINK -->

                <div
                    id="verificationInvalid"
                    style="display: none;"
                >

                    <button
                        type="button"
                        class="auth-submit"
                        id="tryAgainButton"
                    >
                        Try Again
                    </button>

                </div>

            </div>


            <!-- BACK TO LOGIN -->

            <a
                href="login.html"
                class="back-home"
            >
                ← Back to Login
            </a>

        </section>

    </main>


    <script
        type="module"
        src="../js/password-verification.js"
    ></script>
    <script
        type="module"
        src="../js/effects.js"
    ></script>

</body>

</html>
