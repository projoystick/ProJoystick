<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Games — PROJOYSTICK</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/games.css">

</head>

<body>

    <!-- ==========================================
         NAVBAR
    =========================================== -->

    <header class="navbar">

    <div class="nav-container">

        <nav class="nav-links">

            <a href="../index.html">
                Home
            </a>

            <a href="games.html" class="active">
                Games
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="wishlist.html">
                Wishlist
            </a>

        </nav>


        <div class="nav-actions">

            <button
                class="search-btn"
                type="button"
                aria-label="Search"
            >
                🔍
            </button>


            <button
                class="cart-btn"
                type="button"
                aria-label="Cart"
            >

                🛒

                <span class="cart-count">
                    0
                </span>

            </button>

        </div>

    </div>

</header>


    <!-- ==========================================
         GAMES PAGE
    =========================================== -->

    <main class="games-page">

        <div class="games-container">


            <!-- ==========================================
                 PAGE HEADER
            =========================================== -->

            <section class="games-header">

                <div>

                    <span class="page-label">
                        PROJOYSTICK MARKETPLACE
                    </span>

                    <h1>
                        Choose Your Game
                    </h1>

                    <p>
                        Browse games and find
                        in-game currency, items,
                        skins and more.
                    </p>

                </div>


                <!-- SEARCH -->

                <div class="games-search">

                    <span aria-hidden="true">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="gameSearch"
                        placeholder="Search games..."
                        autocomplete="off"
                    >

                </div>

            </section>


            <!-- ==========================================
                 CATEGORY FILTERS
            =========================================== -->

            <section
                class="game-filters"
                aria-label="Game categories"
            >

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all"
                >
                    All Games
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="fps"
                >
                    FPS
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="battle-royale"
                >
                    Battle Royale
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="sports"
                >
                    Sports
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="rpg"
                >
                    RPG
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="moba"
                >
                    MOBA
                </button>

            </section>


            <!-- ==========================================
                 DYNAMIC GAME GRID
                 
                 IMPORTANT:
                 Do NOT put game cards here.
                 games.js loads them from Firebase.
            =========================================== -->

            <section
                class="games-grid"
                id="gamesGrid"
                aria-live="polite"
            >
            </section>


            <!-- ==========================================
                 EMPTY STATE
            =========================================== -->

            <div
                class="games-empty"
                id="gamesEmpty"
            >

                <div>
                    🔍
                </div>

                <h3>
                    No games found
                </h3>

                <p>
                    Try another search or category.
                </p>

            </div>

        </div>

    </main>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script
        type="module"
        src="../js/script.js"
    ></script>

    <script
        type="module"
        src="../js/games.js"
    ></script>

</body>

</html>
