<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Email — PROJOYSTICK</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

    <link
        rel="stylesheet"
        href="../style.css"
    >
    <link
        rel="stylesheet"
        href="../css/effects.css"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <main class="auth-page verification-page">

        <section class="auth-container">

            <!-- BRAND -->

            <a href="../index.html" class="auth-logo">
                <img 
                src="../images/webicon.png" 
                alt="Pro Joystick"class="logo-icon"
                >
                <span
                        class="logo-text"
                    >
                        <span
                            class="logo-pro shiny-text"
                            data-shiny-text="PRO"
                            data-speed="2"
                            data-color="#00ff40"
                            data-shine-color="#ffffff"
                            data-spread="120"
                        >
                            PRO
                        </span>

                        <span
                            class="logo-joystick shiny-text"
                            data-shiny-text="JOYSTICK"
                            data-speed="2"
                            data-color="#ffffff"
                            data-shine-color="#00ff40"
                            data-spread="120"
                        >
                            JOYSTICK
                        </span>
            </a>


            <!-- CARD -->

            <div class="auth-card">

                <div class="auth-header">

                    <span class="auth-label">
                        PROJOYSTICK ACCOUNT
                    </span>

                    <h1 id="verificationTitle">
                        Verify your email
                    </h1>

                    <p id="verificationText">
                        We sent a verification link to your email address.
                        Please open the email and click the verification link.
                    </p>

                </div>


                <!-- STATUS -->

                <div
                    id="verificationStatus"
                    class="auth-message success"
                >
                    Waiting for email verification...
                </div>


                <!-- EMAIL -->

                <p
                    id="verificationEmail"
                    class="verification-email"
                >
                </p>


                <!-- CHECK BUTTON -->

                <div class="verification-actions">

                    <button
                        type="button"
                        id="checkVerification"
                        class="auth-submit"
                    >
                        I've Verified My Email
                    </button>


                    <!-- RESEND -->

                    <button
                        type="button"
                        id="resendVerification"
                        class="google-btn"
                    >
                        Resend Verification Email
                    </button>


                    <!-- LOGIN -->

                    <a
                        href="login.html"
                        id="loginAfterVerification"
                        class="auth-submit verification-login"
                    >
                        Login
                    </a>

                </div>


                <!-- BACK -->

                <p class="auth-switch">

                    <a href="../index.html">
                        ← Back to PROJOYSTICK
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="../js/email-verification.js"
    ></script>

    <script
        type="module"
        src="../js/effects.js"
    ></script>

</body>

</html>
