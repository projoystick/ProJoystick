<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Email — PROJOYSTICK</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body>

    <main class="auth-page verification-page">

        <section class="auth-container">

            <!-- BRAND -->

            <a
                href="../index.html"
                class="auth-logo"
            >

                <span>◆</span>

                PRO<span>JOYSTICK</span>

            </a>


            <!-- CARD -->

            <div class="auth-card">

                <div class="auth-header">

                    <span class="auth-label">
                        PROJOYSTICK ACCOUNT
                    </span>

                    <h1 id="verificationTitle">
                        Verify your email
                    </h1>

                    <p id="verificationText">
                        We sent a verification link to your email address.
                        Please open the email and click the verification link.
                    </p>

                </div>


                <!-- STATUS -->

                <div
                    id="verificationStatus"
                    class="auth-message success"
                >
                    Waiting for email verification...
                </div>


                <!-- EMAIL -->

                <p
                    id="verificationEmail"
                    class="verification-email"
                >
                </p>


                <!-- CHECK BUTTON -->

                <div class="verification-actions">

                    <button
                        type="button"
                        id="checkVerification"
                        class="auth-submit"
                    >
                        I've Verified My Email
                    </button>


                    <!-- RESEND -->

                    <button
                        type="button"
                        id="resendVerification"
                        class="google-btn"
                    >
                        Resend Verification Email
                    </button>


                    <!-- LOGIN -->

                    <a
                        href="login.html"
                        id="loginAfterVerification"
                        class="auth-submit verification-login"
                    >
                        Login
                    </a>

                </div>


                <!-- BACK -->

                <p class="auth-switch">

                    <a href="../index.html">
                        ← Back to PROJOYSTICK
                    </a>

                </p>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="../js/email-verification.js"
    ></script>

</body>

</html>
