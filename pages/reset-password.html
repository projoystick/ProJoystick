<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password — PROJOYSTICK</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-container">

            <!-- BRAND -->

            <a
                href="../index.html"
                class="auth-logo"
            >
                <span>◆</span>
                PRO<span>JOYSTICK</span>
            </a>


            <!-- CARD -->

            <div class="auth-card">

                <!-- HEADER -->

                <div class="auth-header">

                    <span class="auth-label">
                        PROJOYSTICK ACCOUNT
                    </span>

                    <h1 id="resetTitle">
                        Reset your password
                    </h1>

                    <p id="resetDescription">
                        Enter a new password for your account.
                    </p>

                </div>


                <!-- MESSAGE -->

                <div
                    id="authMessage"
                    class="auth-message"
                ></div>


                <!-- RESET FORM -->

                <form id="resetPasswordForm">

                    <div class="form-group">

                        <label for="newPassword">
                            New Password
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="newPassword"
                                name="newPassword"
                                placeholder="Enter new password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                data-target="newPassword"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm new password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                data-target="confirmPassword"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="auth-submit"
                        id="resetPasswordButton"
                    >
                        Reset Password
                    </button>

                </form>


                <!-- SUCCESS -->

                <div
                    id="resetSuccess"
                    style="display: none;"
                >

                    <div class="auth-message success">
                        Your password has been changed successfully.
                    </div>

                    <a
                        href="login.html"
                        class="auth-submit auth-link"
                    >
                        Login
                    </a>

                </div>


                <!-- INVALID LINK -->

                <div
                    id="resetInvalid"
                    style="display: none;"
                >

                    <div class="auth-message error">
                        This password reset link is invalid or has expired.
                    </div>

                    <a
                        href="login.html"
                        class="auth-submit auth-link"
                    >
                        Back to Login
                    </a>

                </div>


            </div>


            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to PROJOYSTICK
            </a>

        </section>

    </main>


    <script
        type="module"
        src="../js/reset-password.js"
    ></script>

</body>

</html>
