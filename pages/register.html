<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account — PROJOYSTICK</title>

    <link rel="stylesheet" href="../css/auth.css">

    <link rel="stylesheet" href="../style.css";>

    <link rel="stylesheet" href="../css/effects.css">

    <link rel="icon" href="../images/webicon.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700;800&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <main class="auth-page">

        <section class="auth-container">

            <!-- BRAND -->

            <a href="../index.html" class="auth-logo">
                <img 
                src="../images/webicon.png" 
                alt="Pro Joystick"class="logo-icon"
                >
                <span
                            class="logo-pro shiny-text"
                            data-shiny-text="PRO"
                            data-speed="2"
                            data-color="#00ff40"
                            data-shine-color="#ffffff"
                            data-spread="120"
                        >
                            PRO
                        </span>

                        <span
                            class="logo-joystick shiny-text"
                            data-shiny-text="JOYSTICK"
                            data-speed="2"
                            data-color="#ffffff"
                            data-shine-color="#00ff40"
                            data-spread="120"
                        >
                            JOYSTICK
                        </span>
            </a>


            <!-- CARD -->

            <div class="auth-card">

                <div class="auth-header">

                    <span class="auth-label">
                        JOIN PROJOYSTICK
                    </span>

                    <h1>
                        Create your account
                    </h1>

                    <p>
                        Start buying and managing your gaming items.
                    </p>

                </div>


                <!-- MESSAGE -->

                <div
                    id="authMessage"
                    class="auth-message"
                ></div>


                <!-- FORM -->

                <form id="registerForm">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            autocomplete="username"
                            minlength="3"
                            maxlength="20"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                autocomplete="new-password"
                                minlength="6"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                data-target="password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-input">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="show-password"
                                data-target="confirmPassword"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">
                                Terms of Service
                            </a>
                            and
                            <a href="#">
                                Privacy Policy
                            </a>.
                        </span>

                    </label>


                    <button
                        type="submit"
                        class="auth-submit"
                        id="registerButton"
                    >
                        Create Account
                    </button>

                </form>


                <div class="auth-divider">
                    <span>OR</span>
                </div>


                <!-- GOOGLE -->

                <button
                    type="button"
                    class="google-btn"
                    id="googleRegister"
                >
                    <span class="google-icon">G</span>
                    Continue with Google
                </button>


                <!-- LOGIN -->

                <p class="auth-switch">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>


            <a href="../index.html" class="back-home">
                ← Back to PROJOYSTICK
            </a>

        </section>

    </main>


    <script type="module" src="../js/auth.js"></script>

    <script
        type="module"
        src="../js/effects.js"
    ></script>

</body>

</html>
